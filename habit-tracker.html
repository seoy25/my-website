<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Flow — 습관 달력 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text-primary: #f0ede8;
    --text-secondary: #8a8a9a;
    --text-muted: #4a4a5a;
    --accent: #c8b87a;
    --accent-dim: rgba(200,184,122,0.15);
    --accent-glow: rgba(200,184,122,0.08);
    --success: #6fcf97;
    --success-dim: rgba(111,207,151,0.15);
    --today-ring: #e8c86a;
    --danger: #eb5757;
    --radius-card: 20px;
    --radius-sm: 10px;
    --shadow-card: 0 8px 40px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.05) inset;
    --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Background mesh ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(200,184,122,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 80% 80%, rgba(111,207,151,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 50% 50%, rgba(255,255,255,0.015) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Layout ── */
  .page-wrap {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ── Header ── */
  .site-header {
    text-align: center;
    margin-bottom: 52px;
    animation: fadeDown 0.6s ease both;
  }

  .site-header .logo {
    font-family: 'Fraunces', serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 8px;
  }

  .site-header .logo span {
    color: var(--accent);
    font-style: italic;
  }

  .site-header .tagline {
    font-size: 0.88rem;
    color: var(--text-secondary);
    font-weight: 300;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── Add Habit Form ── */
  .add-habit-form {
    display: flex;
    gap: 10px;
    max-width: 560px;
    margin: 0 auto 56px;
    animation: fadeDown 0.6s 0.1s ease both;
  }

  .habit-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  .habit-input::placeholder { color: var(--text-muted); }

  .habit-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .add-btn {
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
    box-shadow: 0 4px 20px rgba(200,184,122,0.3);
  }

  .add-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 6px 28px rgba(200,184,122,0.4);
  }

  .add-btn:active { transform: translateY(0); }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    animation: fadeIn 0.5s ease both;
  }

  .empty-state .icon {
    font-size: 3rem;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty-state p {
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.6;
  }

  /* ── Cards grid ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
  }

  /* ── Habit Card ── */
  .habit-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 28px;
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    animation: cardIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    position: relative;
    overflow: hidden;
  }

  .habit-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  }

  .habit-card:hover {
    transform: translateY(-3px);
    border-color: var(--border-strong);
    box-shadow: 0 16px 60px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.07) inset;
  }

  /* Card header */
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
  }

  .card-title-group { flex: 1; min-width: 0; }

  .card-habit-name {
    font-family: 'Fraunces', serif;
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .card-date-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .delete-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background var(--transition), border-color var(--transition), color var(--transition);
    font-size: 0.85rem;
  }

  .delete-btn:hover {
    background: rgba(235,87,87,0.12);
    border-color: var(--danger);
    color: var(--danger);
  }

  /* Progress */
  .progress-section { margin-bottom: 22px; }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .progress-label {
    font-size: 0.78rem;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .progress-pct {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    height: 5px;
    background: rgba(255,255,255,0.06);
    border-radius: 100px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #e8d890);
    border-radius: 100px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    min-width: 0;
    box-shadow: 0 0 10px rgba(200,184,122,0.4);
  }

  /* Calendar */
  .calendar-wrap { user-select: none; }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }

  .cal-weekday {
    text-align: center;
    font-size: 0.68rem;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 4px 0;
    text-transform: uppercase;
  }

  .cal-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background var(--transition), color var(--transition), transform var(--transition);
    position: relative;
  }

  .cal-day.empty { cursor: default; }

  .cal-day:not(.empty):hover {
    background: var(--surface-hover);
    color: var(--text-primary);
    transform: scale(1.08);
  }

  .cal-day.checked {
    background: var(--success-dim);
    color: var(--success) !important;
    font-weight: 500;
  }

  .cal-day.checked::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    border: 1px solid rgba(111,207,151,0.3);
  }

  .cal-day.today {
    color: var(--today-ring) !important;
    font-weight: 700;
  }

  .cal-day.today::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    border: 1.5px solid var(--today-ring);
    opacity: 0.7;
  }

  .cal-day.today.checked {
    background: rgba(232,200,106,0.15);
  }

  .cal-day.today.checked::after {
    border-color: rgba(232,200,106,0.4);
  }

  /* Streak badge */
  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--accent-dim);
    border: 1px solid rgba(200,184,122,0.2);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 0.75rem;
    color: var(--accent);
    font-weight: 500;
    margin-top: 16px;
  }

  /* ── Animations ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .page-wrap { padding: 32px 16px 60px; }

    .add-habit-form { gap: 8px; }

    .add-btn { padding: 14px 16px; font-size: 0.85rem; }

    .cards-grid { grid-template-columns: 1fr; }

    .habit-card { padding: 22px 18px; }

    .cal-day { font-size: 0.75rem; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
</style>
</head>
<body>
<div class="page-wrap">

  <header class="site-header">
    <div class="logo">Habit<span>Flow</span></div>
    <div class="tagline">매일 쌓이는 작은 습관이 삶을 바꿉니다</div>
  </header>

  <div class="add-habit-form">
    <input
      class="habit-input"
      id="habitInput"
      type="text"
      placeholder="새 습관을 입력하세요 (예: 물 2L 마시기)"
      maxlength="40"
      autocomplete="off"
    />
    <button class="add-btn" id="addBtn">+ 추가</button>
  </div>

  <div id="cardsContainer" class="cards-grid"></div>

</div>

<script>
(() => {
  const STORAGE_KEY = 'habitflow_v1';
  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  /* ── State ── */
  let habits = loadHabits();

  /* ── Persistence ── */
  function loadHabits() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch { return []; }
  }

  function saveHabits() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
  }

  /* ── Date helpers ── */
  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }

  function dayKey(year, month, day) {
    return `${year}-${month}-${day}`;
  }

  function getDaysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
  }

  function getFirstDayOfWeek(year, month) {
    return new Date(year, month, 1).getDay();
  }

  /* ── Calendar streak ── */
  function calcStreak(checkedSet, year, month) {
    const today = new Date();
    const isCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);
    const lastDay = isCurrentMonth ? today.getDate() : getDaysInMonth(year, month);
    let streak = 0;
    for (let d = lastDay; d >= 1; d--) {
      if (checkedSet.has(dayKey(year, month, d))) streak++;
      else break;
    }
    return streak;
  }

  /* ── Render ── */
  function renderAll() {
    const container = document.getElementById('cardsContainer');
    container.innerHTML = '';

    if (habits.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="icon">🌱</div>
          <p>아직 등록된 습관이 없어요.<br>위에서 첫 번째 습관을 추가해보세요!</p>
        </div>`;
      return;
    }

    habits.forEach((habit, idx) => {
      const card = buildCard(habit, idx);
      container.appendChild(card);
    });
  }

  function buildCard(habit, idx) {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const daysInMonth = getDaysInMonth(year, month);
    const firstDow = getFirstDayOfWeek(year, month);
    const today = now.getDate();

    const checkedSet = new Set(habit.checked || []);
    const checkedCount = checkedSet.size;
    const pct = Math.round((checkedCount / daysInMonth) * 100);
    const streak = calcStreak(checkedSet, year, month);

    // Card element
    const card = document.createElement('div');
    card.className = 'habit-card';
    card.dataset.idx = idx;

    // Header
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title-group">
          <div class="card-habit-name" title="${escHtml(habit.name)}">${escHtml(habit.name)}</div>
          <div class="card-date-label">${year}년 ${MONTH_NAMES[month]}</div>
        </div>
        <button class="delete-btn" data-idx="${idx}" title="습관 삭제" aria-label="삭제">✕</button>
      </div>

      <div class="progress-section">
        <div class="progress-meta">
          <span class="progress-label">이번 달 달성률 · ${checkedCount}/${daysInMonth}일</span>
          <span class="progress-pct">${pct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
      </div>

      <div class="calendar-wrap">
        <div class="cal-weekdays">
          ${WEEKDAYS.map(w => `<div class="cal-weekday">${w}</div>`).join('')}
        </div>
        <div class="cal-days" data-idx="${idx}">
          ${buildCalGrid(year, month, firstDow, daysInMonth, today, checkedSet)}
        </div>
      </div>

      ${streak > 0 ? `<div class="streak-badge">🔥 ${streak}일 연속 달성 중!</div>` : `<div class="streak-badge" style="opacity:0.4">✦ 오늘부터 시작해보세요</div>`}
    `;

    // Day click
    card.querySelector('.cal-days').addEventListener('click', e => {
      const dayEl = e.target.closest('.cal-day:not(.empty)');
      if (!dayEl) return;
      const d = parseInt(dayEl.dataset.day);
      const k = dayKey(year, month, d);
      const set = new Set(habits[idx].checked || []);
      if (set.has(k)) set.delete(k);
      else set.add(k);
      habits[idx].checked = [...set];
      saveHabits();
      renderAll();
    });

    // Delete
    card.querySelector('.delete-btn').addEventListener('click', () => {
      if (confirm(`"${habit.name}" 습관을 삭제할까요?`)) {
        habits.splice(idx, 1);
        saveHabits();
        renderAll();
      }
    });

    return card;
  }

  function buildCalGrid(year, month, firstDow, daysInMonth, today, checkedSet) {
    let cells = '';
    // Empty cells before first day
    for (let i = 0; i < firstDow; i++) {
      cells += `<div class="cal-day empty"></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const k = dayKey(year, month, d);
      const isChecked = checkedSet.has(k);
      const isToday = (d === today);
      const cls = ['cal-day', isChecked ? 'checked' : '', isToday ? 'today' : ''].filter(Boolean).join(' ');
      cells += `<div class="${cls}" data-day="${d}">${d}</div>`;
    }
    return cells;
  }

  /* ── Add habit ── */
  function addHabit() {
    const input = document.getElementById('habitInput');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    habits.push({ id: Date.now(), name, checked: [] });
    saveHabits();
    input.value = '';
    renderAll();
    // Scroll to last card
    setTimeout(() => {
      const cards = document.querySelectorAll('.habit-card');
      if (cards.length) cards[cards.length-1].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
  }

  /* ── Events ── */
  document.getElementById('addBtn').addEventListener('click', addHabit);
  document.getElementById('habitInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addHabit();
  });

  /* ── Utils ── */
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Init ── */
  renderAll();
})();
</script>
</body>
</html>
